name: Host-CPU matrix

# Validates the two unverified claims behind the `host-cpu` comparability axis (model/compat.ts,
# docs/dev/cpu-profiling.md): that meta.hostCpuIndex is monotonic with real CPU speed across machines,
# and that the 25%-apart gate threshold separates host classes without a cross-arch loop skew tripping
# a similar-speed pair. It runs the SHIPPED microbenchmark on each of GitHub's five distinct hosted
# runner classes and reports the index distribution per host.
#
# workflow_dispatch ONLY: no push/PR/schedule trigger, zero recurring cost. Each run is a deliberate
# human act -- `gh workflow run host-cpu-matrix.yml` (or the Actions tab). Every job is browser-free
# (PUPPETEER_SKIP_DOWNLOAD) and does only checkout -> node 24 -> npm ci -> build -> probe, ~2-3 min.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false # one runner class hiccuping must not cancel the others; a partial matrix is still useful
      matrix:
        os:
          - ubuntu-latest # x64 Linux
          - ubuntu-24.04-arm # ARM Linux
          - macos-latest # ARM macOS (Apple silicon)
          - macos-13 # x64 macOS (Intel)
          - windows-latest # x64 Windows
    runs-on: ${{ matrix.os }}
    # a wedged job fails fast instead of burning toward the 6h ceiling (a normal probe run is ~2-3 min)
    timeout-minutes: 10
    env:
      # The probe needs only node + the built dist/model/host-cpu.js, never a browser.
      PUPPETEER_SKIP_DOWNLOAD: "true"
      HOST_CPU_LABEL: ${{ matrix.os }}
      HOST_CPU_OUT: host-cpu-${{ matrix.os }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Runs the shipped measureHostCpuIndex 10x, prints the distribution, appends a table to the run
      # summary, and writes $HOST_CPU_OUT. Plain `run:` with a `node` invocation is cross-platform, so
      # this same step works under Windows' default shell (pwsh) without a bash-ism.
      - run: node scripts/host-cpu-probe.mjs
      - uses: actions/upload-artifact@v4
        with:
          # Per-os name so the five uploads don't collide; download all and pass to
          # scripts/host-cpu-analyze.mjs for the ratio matrix + threshold + cross-arch skew read.
          name: host-cpu-${{ matrix.os }}
          path: host-cpu-${{ matrix.os }}.json
          if-no-files-found: error
